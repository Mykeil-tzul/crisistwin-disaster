name: Refresh and publish CrisisTwin
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: crisistwin-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - id: nasa
        continue-on-error: true
        run: python scripts/refresh.py
      - name: Preserve last successful snapshot
        if: steps.nasa.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh NASA wildfire snapshot'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Flag a failed NASA refresh
        if: steps.nasa.outcome == 'failure'
        run: echo "::warning::NASA refresh failed. The dashboard still uses the last successful snapshot."
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
